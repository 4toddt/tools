<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="twitter:image" content="https://4toddt.github.io/tools/casegood-review/og.png">
<style>
  :root {
    --bg: #F5F3EE;
    --surface: #ffffff;
    --border: #E6E2D5;
    --border-soft: #EEEAE0;
    --ink: #1a1a1a;
    --ink-soft: #404040;
    --muted: #757575;
    --muted-soft: #B0B0B0;
    --accent: #003349;
    --hot: #BD472A;
    --hot-soft: #F7E3DE;
    --ok: #1f6b3a;
    --ok-soft: #e5f6eb;
    --ok-edge: #9ed4b0;
    --warn: #8a6d1d;
    --warn-soft: #f8f1d8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  button, input, select { font: inherit; }

  .chrome {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(245, 243, 238, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1rem .85rem;
  }
  .chrome-inner { max-width: 1100px; margin: 0 auto; }
  .chrome h1 {
    margin: 0 0 .15rem;
    font-size: 1.05rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--accent);
  }
  .chrome .meta {
    color: var(--muted);
    font-size: .8rem;
    margin-bottom: .65rem;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: .45rem .55rem;
    align-items: center;
  }
  .filters input[type="search"] {
    min-width: 12rem;
    flex: 1 1 12rem;
    padding: .4rem .6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
  }
  .filters select {
    padding: .4rem .55rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
  }
  .filters label.check {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    color: var(--ink-soft);
    font-size: .88rem;
    user-select: none;
    white-space: nowrap;
  }
  .count {
    margin-left: auto;
    color: var(--muted);
    font-size: .82rem;
    white-space: nowrap;
  }
  .filter-hint {
    width: 100%;
    font-size: .75rem;
    color: var(--muted);
    margin-top: .15rem;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 1rem 4rem;
  }
  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    margin: .25rem 0 1rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .pager button {
    padding: .35rem .7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
  }
  .pager button:disabled { opacity: .45; cursor: default; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 1rem;
    overflow: hidden;
    scroll-margin-top: 8rem;
  }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem .75rem;
    align-items: baseline;
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border-soft);
    background: #fafaf7;
  }
  .card-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .sku {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .82rem;
    color: var(--muted);
  }
  .badge {
    display: inline-block;
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: .15rem .45rem;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .badge.new { background: #e8f0fe; color: #1a4b8c; border-color: #b6cdf5; }
  .badge.update { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-edge); }
  .badge.live { background: #eee; color: var(--muted); border-color: #ddd; }
  .badge.offline { background: #eee; color: var(--muted); border-color: #ddd; }
  .badge.copy-new { background: var(--warn-soft); color: var(--warn); border-color: #e6d59a; }

  .delta-chips {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    width: 100%;
  }
  .delta-chip {
    font-size: .72rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--ok-soft);
    color: var(--ok);
    border: 1px solid var(--ok-edge);
    border-radius: 4px;
    padding: .12rem .4rem;
  }
  .delta-chip.added { background: #e8f0fe; color: #1a4b8c; border-color: #b6cdf5; }

  .card-body {
    display: grid;
    grid-template-columns: minmax(200px, 280px) 1fr;
    gap: 0;
  }
  .card.copy-focus .card-body {
    grid-template-columns: minmax(180px, 240px) 1fr;
  }
  @media (max-width: 780px) {
    .card-body { grid-template-columns: 1fr; }
  }

  .gallery {
    padding: .85rem;
    border-right: 1px solid var(--border-soft);
    background: #fbfbf9;
  }
  @media (max-width: 780px) {
    .gallery { border-right: 0; border-bottom: 1px solid var(--border-soft); }
  }
  .hero {
    width: 100%;
    aspect-ratio: 1;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .hero .ph {
    color: var(--muted-soft);
    font-size: .85rem;
    padding: 1rem;
    text-align: center;
  }
  .thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin-top: .55rem;
  }
  .mouseover-panel {
    margin-top: .65rem;
    padding-top: .55rem;
    border-top: 1px dashed var(--border);
  }
  .mouseover-panel .mo-label {
    font-size: .72rem;
    font-weight: 650;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .35rem;
  }
  .mouseover-panel .mo-filename {
    font-size: .78rem;
    color: var(--ink-soft);
    word-break: break-all;
    margin-bottom: .4rem;
  }
  .mouseover-panel .mo-frame {
    width: 100%;
    max-width: 11rem;
    aspect-ratio: 1;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .mouseover-panel .mo-frame img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  .mouseover-panel .mo-empty {
    font-size: .82rem;
    color: var(--muted-soft);
    font-style: italic;
  }
  .thumbs button {
    width: 48px;
    height: 48px;
    padding: 0;
    border: 2px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    overflow: hidden;
  }
  .thumbs button.active { border-color: var(--accent); }
  .thumbs button img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .detail { padding: .85rem 1rem 1rem; min-width: 0; }

  .section-label {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: .15rem 0 .4rem;
  }
  .fields {
    width: 100%;
    border-collapse: collapse;
    font-size: .8rem;
    margin-bottom: .85rem;
  }
  .fields th,
  .fields td {
    text-align: left;
    padding: .28rem .4rem;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: top;
  }
  .fields th {
    width: 11.5rem;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .fields td {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .78rem;
    word-break: break-word;
    color: var(--ink-soft);
  }
  .fields tr:last-child th,
  .fields tr:last-child td { border-bottom: 0; }

  /* green highlight for changed / new values */
  .fields tr.delta-row th {
    color: var(--ok);
    font-weight: 650;
  }
  .fields tr.delta-row td {
    background: var(--ok-soft);
    color: var(--ok);
    border-radius: 0;
  }
  .fields tr.delta-row td .was {
    display: block;
    font-size: .72rem;
    color: var(--muted);
    font-weight: 400;
    margin-top: .15rem;
  }
  .fields tr.delta-row td .was s {
    color: #a05050;
  }
  .feat-block { margin: 0; }
  .feat-line-label {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--muted);
    margin: .15rem 0 .2rem;
  }
  .feat-line-label.drop { color: var(--hot); margin-top: .45rem; }
  .feat-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .28rem;
  }
  .feat-tag {
    font-size: .72rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: .12rem .4rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #f7f5f0;
    color: var(--ink-soft);
  }
  .feat-tag.added {
    background: var(--ok-soft);
    border-color: var(--ok-edge);
    color: var(--ok);
    font-weight: 600;
  }
  .feat-tag.removed {
    background: var(--hot-soft);
    border-color: #e8b4a8;
    color: var(--hot);
  }
  .feat-empty {
    font-size: .78rem;
    color: var(--muted);
    font-style: italic;
  }
  .fields tr.feat-delta-row td {
    /* keep green row but let nested labels stay readable */
    padding-top: .45rem;
    padding-bottom: .5rem;
  }
  .fields tr.feat-delta-row td .feat-line-label {
    color: #5a7a62;
  }
  .fields tr.feat-delta-row td .feat-line-label.drop {
    color: var(--hot);
  }
  .card.features-focus .fields th { width: 9.5rem; }
  .card.images-focus .card-body {
    grid-template-columns: minmax(16rem, 1.15fr) minmax(14rem, 1fr);
  }
  .card.images-focus .gallery {
    position: sticky;
    top: 5.5rem;
    align-self: start;
  }
  .card.images-focus .fields th { width: 10.5rem; }
  .view-select { min-width: 9.5rem; }

  /* offline reason under showOnline: false */
  .fields tr.offline-row td {
    vertical-align: top;
  }
  .offline-reasons {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    margin-top: .35rem;
  }
  .offline-reasons .why {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .01em;
    color: #6b3a12;
    background: #f6ebe0;
    border: 1px solid #e5c9a8;
    border-radius: 999px;
    padding: .12rem .5rem;
  }
  .offline-reasons .why-label {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: .7rem;
    color: var(--muted);
    width: 100%;
    margin: 0 0 .05rem;
  }

  .copy-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: .55rem;
    overflow: hidden;
  }
  .copy-block.news {
    border-color: var(--ok-edge);
  }
  .copy-block header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    padding: .35rem .6rem;
    background: #f7f5f0;
    border-bottom: 1px solid var(--border-soft);
    font-size: .78rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .copy-block.news header {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .copy-block .pane {
    padding: .65rem .75rem;
    font-size: .9rem;
    line-height: 1.5;
  }
  .copy-block .pane.empty {
    color: var(--muted-soft);
    font-style: italic;
    font-size: .85rem;
  }
  .copy-block .pane p { margin: 0 0 .5em; }
  .copy-block .pane p:last-child { margin-bottom: 0; }
  .copy-block .pane ul { margin: 0; padding-left: 1.15rem; }
  .copy-block .pane li { margin: .15rem 0; }

  .side-by-side {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  @media (max-width: 700px) {
    .side-by-side { grid-template-columns: 1fr; }
  }
  .side-by-side .col { border-right: 1px solid var(--border-soft); }
  .side-by-side .col:last-child { border-right: 0; }
  .side-by-side .col-label {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--muted);
    padding: .3rem .65rem 0;
  }
  .col.before-col { background: #fbf8f4; }
  .col.after-col { background: var(--ok-soft); }

  .diff-pane {
    padding: .65rem .75rem;
    font-size: .9rem;
    line-height: 1.55;
  }
  .diff-pane del {
    background: #fde2e2;
    color: #7a1f1f;
    text-decoration: line-through;
    border-radius: 2px;
  }
  .diff-pane ins {
    background: #cfeedd;
    color: #1f5a36;
    text-decoration: none;
    border-radius: 2px;
  }

  .notes {
    margin-top: .5rem;
    font-size: .78rem;
    color: var(--muted);
  }
  .notes strong { color: var(--ink-soft); }
  .blockers {
    margin-top: .35rem;
    color: var(--hot);
    font-size: .8rem;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
  }
  .load-err {
    background: var(--hot-soft);
    border: 1px solid #edb8ab;
    color: var(--hot);
    padding: .75rem 1rem;
    border-radius: 8px;
    margin: 1rem 0;
  }
  .no-delta-note {
    font-size: .82rem;
    color: var(--muted);
    margin: 0 0 .75rem;
    padding: .5rem .65rem;
    background: #f7f5f0;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="chrome">
    <div class="chrome-inner">
      <h1>Hammary casegood review</h1>
      <div class="meta" id="metaLine">Loading…</div>
      <div class="filters">
        <input type="search" id="q" placeholder="Search SKU, name, series…" autocomplete="off">
        <select id="kind" title="Product set">
          <option value="all">All products</option>
          <option value="new">New (create)</option>
          <option value="update">Live — has changes</option>
          <option value="live">Live — no changes</option>
          <option value="inBcc">All live (in BCC)</option>
        </select>
        <select id="online" title="showOnline">
          <option value="all">showOnline: all</option>
          <option value="true">showOnline: true</option>
          <option value="false">showOnline: false</option>
        </select>
        <select id="view" class="view-select" title="Card detail focus">
          <option value="all">View: all fields</option>
          <option value="copy">View: copy</option>
          <option value="features">View: features</option>
          <option value="images">View: images</option>
        </select>
        <select id="pageSize" title="Page size">
          <option value="12">12 / page</option>
          <option value="25" selected>25 / page</option>
          <option value="50">50 / page</option>
          <option value="100">100 / page</option>
          <option value="0">All</option>
        </select>
        <span class="count" id="countLine" aria-live="polite"></span>
        <div class="filter-hint" id="filterHint"></div>
      </div>
    </div>
  </div>

  <main>
    <div id="err" class="load-err" hidden></div>
    <div class="pager" id="pager" hidden>
      <button type="button" id="prevBtn">← Prev</button>
      <span id="pageInfo"></span>
      <button type="button" id="nextBtn">Next →</button>
    </div>
    <div id="list"></div>
    <div id="empty" class="empty-state" hidden>No products match these filters.</div>
  </main>

  <script src="data.js"></script>
  <script>
(function () {
  const FIELD_ORDER = [
    'product.ID', 'product.displayName', 'product.childSKUs', 'product.categoryIds',
    'product.3DRoomPlanner', 'product.willFitMyRoom',
    'sku.ID', 'styleNumber', 'stylePrefix', 'styleSuffix', 'vendorID',
    'namePrefix', 'nameSuffix',
    'showOnline', 'isPurchaseable', 'unsearchable', 'status',
    'exteriorWidth', 'exteriorDepth', 'exteriorHeight',
    'cdpDefaultImage', 'cdpMouseOverImage', 'altImages', 'wtbLeftImg',
    'shortDescription', 'features', 'bundleLinks',
  ];

  const COPY_FIELDS = [
    { key: 'romanceCopy', label: 'Romance' },
    { key: 'longDescription', label: 'Long description' },
    { key: 'atAGlanceContent', label: 'At a glance' },
    { key: 'useCareInstructions', label: 'Use & care' },
    { key: 'resources', label: 'Resources' },
  ];

  const COPY_NEWS_KEYS = ['romanceCopy', 'longDescription', 'atAGlanceContent'];

  /** Fields shown in features-focused view (context + tags). */
  const FEATURE_VIEW_FIELDS = [
    'product.displayName',
    'product.categoryIds',
    'namePrefix',
    'nameSuffix',
    'exteriorWidth',
    'exteriorDepth',
    'exteriorHeight',
    'features',
  ];

  /** Image review: identity + image-related import fields only. */
  const IMAGE_VIEW_FIELDS = [
    'product.displayName',
    'product.categoryIds',
    'cdpDefaultImage',
    'cdpMouseOverImage',
    'altImages',
    'wtbLeftImg',
    'showOnline',
  ];

  const state = {
    data: null,
    kind: 'all',
    online: 'all',
    q: '',
    view: 'all', // all | copy | features | images
    page: 0,
    pageSize: 25,
  };

  const $ = (id) => document.getElementById(id);
  const listEl = $('list');
  const emptyEl = $('empty');
  const errEl = $('err');
  const pagerEl = $('pager');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function isTruthy(v) {
    return v === true || v === 'true' || v === 'True' || v === 1 || v === '1';
  }

  function isFalsyOnline(v) {
    return v === false || v === 'false' || v === 'False' || v === 0 || v === '0';
  }

  function kindOf(p) {
    return p.kind || p.mode || 'new';
  }

  function hasCopyNews(p) {
    const c = p.copy || {};
    // Live product: wording changed or copy newly added on update
    const liveNews = COPY_NEWS_KEYS.some((k) => c[k] && (c[k].changed || c[k].added));
    if (liveNews) return true;
    // Create with any merch copy
    if (kindOf(p) === 'new') {
      return COPY_NEWS_KEYS.some((k) => c[k] && String(c[k].after || '').trim());
    }
    return false;
  }

  function hasFeatureNews(p) {
    if (p.deltas && p.deltas.features) return true;
    if (kindOf(p) === 'new' && String((p.fields && p.fields.features) || '').trim()) return true;
    return false;
  }

  /** Primary + any alts that are not the same URL → multi-image set for review. */
  function imageList(p) {
    const imgs = [];
    if (p.images && p.images.primary) imgs.push(p.images.primary);
    (p.images && p.images.alts || []).forEach((u) => {
      if (u && !imgs.includes(u)) imgs.push(u);
    });
    return imgs;
  }

  function hasMultipleImages(p) {
    return imageList(p).length >= 2;
  }

  function deltaList(p) {
    const d = p.deltas || {};
    return Object.keys(d);
  }

  function filtered() {
    const products = state.data.products;
    const q = state.q.trim().toLowerCase();
    return products.filter((p) => {
      const k = kindOf(p);
      if (state.kind === 'new' && k !== 'new') return false;
      if (state.kind === 'update' && k !== 'update') return false;
      if (state.kind === 'live' && k !== 'live') return false;
      if (state.kind === 'inBcc' && !(p.inBcc || k === 'update' || k === 'live')) return false;

      if (state.online === 'true' && !isTruthy(p.fields.showOnline)) return false;
      if (state.online === 'false' && !isFalsyOnline(p.fields.showOnline) && isTruthy(p.fields.showOnline)) return false;
      if (state.online === 'false' && isTruthy(p.fields.showOnline)) return false;

      if (state.view === 'copy' && !hasCopyNews(p)) return false;
      if (state.view === 'features' && !hasFeatureNews(p)) return false;
      if (state.view === 'images' && !hasMultipleImages(p)) return false;

      if (!q) return true;
      const hay = [
        p.sku,
        p.displayName,
        p.series,
        p.fields && p.fields['product.categoryIds'],
        p.fields && p.fields.namePrefix,
        p.fields && p.fields.nameSuffix,
        p.fields && p.fields.features,
        p.fields && p.fields.cdpDefaultImage,
        p.fields && p.fields.cdpMouseOverImage,
        p.fields && p.fields.altImages,
        deltaList(p).join(' '),
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  function pageSlice(items) {
    // Coerce in case select value was left as a string
    const size = Number(state.pageSize) || 0;
    if (!size) return { pageItems: items, pages: 1, start: 0, size };
    const pages = Math.max(1, Math.ceil(items.length / size));
    if (state.page >= pages) state.page = pages - 1;
    if (state.page < 0) state.page = 0;
    const start = state.page * size;
    return { pageItems: items.slice(start, start + size), pages, start, size };
  }

  /** Always-fresh range for the chrome + pager, e.g. "1–25 of 128". */
  function rangeText(total, start, pageCount, size) {
    if (!total) return '0 of 0';
    if (!size || total <= pageCount) {
      // Single page / "All"
      return pageCount ? `1–${pageCount} of ${total}` : `0 of ${total}`;
    }
    const from = start + 1;
    const to = start + pageCount;
    return `${from}–${to} of ${total}`;
  }

  /**
   * Bust browser/CDN image cache when file content changes but the URL path does not
   * (e.g. category ↔ alt byte swaps). Uses data.meta.generated so each export refreshes thumbs.
   */
  function cacheBust(url) {
    if (!url) return url;
    const gen =
      (state.data && state.data.meta && state.data.meta.generated) ||
      (window.CASEGOOD_REVIEW_DATA &&
        window.CASEGOOD_REVIEW_DATA.meta &&
        window.CASEGOOD_REVIEW_DATA.meta.generated) ||
      '';
    const v = String(gen).replace(/[^0-9TZ]/g, '') || String(Date.now());
    return url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v);
  }

  function mouseoverUrl(p) {
    if (p.images && p.images.mouseover) return p.images.mouseover;
    const name = p.fields && p.fields.cdpMouseOverImage;
    if (!name || name === '—' || !String(name).trim()) return '';
    const s = String(name).trim();
    if (/^https?:\/\//i.test(s)) return s;
    return 'https://content.la-z-boy.com/img/product/categoryalt/' + s.replace(/^\//, '');
  }

  function galleryHtml(p) {
    const imgs = [];
    if (p.images && p.images.primary) imgs.push(p.images.primary);
    (p.images && p.images.alts || []).forEach((u) => {
      if (u && !imgs.includes(u)) imgs.push(u);
    });
    const first = imgs[0] || '';
    const firstB = first ? cacheBust(first) : '';
    const hero = firstB
      ? `<img class="hero-img" src="${esc(firstB)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
      : `<div class="ph">No image</div>`;
    const thumbs = imgs.map((u, i) => {
      const ub = cacheBust(u);
      return `<button type="button" class="thumb${i === 0 ? ' active' : ''}" data-src="${esc(ub)}" title="Image ${i + 1}">
        <img src="${esc(ub)}" alt="" loading="lazy" referrerpolicy="no-referrer">
      </button>`;
    }).join('');

    const mo = mouseoverUrl(p);
    const moName = (p.fields && p.fields.cdpMouseOverImage) || (mo && mo.split('/').pop()) || '';
    const moPanel = mo
      ? `<div class="mouseover-panel">
          <div class="mo-label">Mouseover (PLP hover)</div>
          <div class="mo-filename">${esc(moName)}</div>
          <div class="mo-frame">
            <img src="${esc(cacheBust(mo))}" alt="Mouseover" loading="lazy" referrerpolicy="no-referrer">
          </div>
        </div>`
      : `<div class="mouseover-panel">
          <div class="mo-label">Mouseover (PLP hover)</div>
          <div class="mo-empty">None — no cdpMouseOverImage</div>
        </div>`;

    return `
      <div class="gallery">
        <div class="hero">${hero}</div>
        ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
        ${moPanel}
      </div>`;
  }

  function featureTagsHtml(d, currentDisplay) {
    /**
     * Clearer than a single mixed chip row + "was: …":
     *  1) Import — full set we will load (new tags marked + green)
     *  2) Dropping from live — only tags present live that import removes
     * No full-string "was:" line (that mixed kept Buried with struck-through Buried).
     */
    if (d && (d.addedTags || d.removedTags || d.afterList || d.beforeList)) {
      const added = new Set(d.addedTags || []);
      const after = d.afterList || [];
      const removed = d.removedTags || [];
      const importChips = after.length
        ? after.map((t) =>
            added.has(t)
              ? `<span class="feat-tag added" title="New vs live">+ ${esc(t)}</span>`
              : `<span class="feat-tag" title="Unchanged vs live">${esc(t)}</span>`
          ).join('')
        : '<span class="feat-empty">(none on import)</span>';
      let html = `<div class="feat-block">
        <div class="feat-line-label">Import (load these)</div>
        <div class="feat-tags">${importChips}</div>`;
      if (removed.length) {
        html += `<div class="feat-line-label drop">Dropping from live</div>
        <div class="feat-tags">${removed.map((t) =>
          `<span class="feat-tag removed" title="On live BCC; not on import">− ${esc(t)}</span>`
        ).join('')}</div>`;
      }
      html += `</div>`;
      return html;
    }
    // No delta — simple chips (creates, or live match)
    const tags = String(currentDisplay || '').split(',').map((s) => s.trim()).filter(Boolean);
    if (!tags.length) return '<span class="feat-empty">(none)</span>';
    return `<div class="feat-block">
      <div class="feat-line-label">${/* label set by caller context */ ''}Import</div>
      <div class="feat-tags">${tags.map((t) => `<span class="feat-tag">${esc(t)}</span>`).join('')}</div>
    </div>`;
  }

  function fieldsHtml(p) {
    const deltaMap = p.deltaFieldKeys || {};
    const deltas = p.deltas || {};
    const offlineReasons = p.offlineReasons || [];
    const order = state.view === 'features'
      ? FEATURE_VIEW_FIELDS
      : state.view === 'images'
        ? IMAGE_VIEW_FIELDS
        : FIELD_ORDER;
    const rows = order.map((k) => {
      let v = p.fields[k];
      if (v == null || v === '') v = '—';
      else if (typeof v === 'boolean') v = v ? 'true' : 'false';

      const d = deltaMap[k] || (deltas[k] ? deltas[k] : null);
      let extra = '';
      if (k === 'showOnline' && !isTruthy(p.fields.showOnline) && offlineReasons.length) {
        extra = `<div class="offline-reasons">
          <div class="why-label">Why it’s offline</div>
          ${offlineReasons.map((r) => `<span class="why">${esc(r)}</span>`).join('')}
        </div>`;
      }

      // Features: structured import vs drop chips (no struck-through "was:" dump)
      if (k === 'features') {
        const tags = featureTagsHtml(d, v === '—' ? '' : v);
        if (d) {
          const label = d.kind === 'added' ? 'features · new vs live'
            : d.kind === 'removed' ? 'features · clearing live'
            : 'features · changed vs live';
          return `<tr class="delta-row feat-delta-row" title="Feature tags differ from live BCC">
            <th>${label}</th>
            <td>${tags}</td>
          </tr>`;
        }
        return `<tr><th>features</th><td>${tags}</td></tr>`;
      }

      if (d) {
        const was = d.before === '' || d.before == null
          ? '<span class="was">(was empty)</span>'
          : `<span class="was">was: <s>${esc(String(d.before).length > 80 ? String(d.before).slice(0, 80) + '…' : d.before)}</s></span>`;
        return `<tr class="delta-row${extra ? ' offline-row' : ''}" title="Changed vs live BCC">
          <th>${esc(k)} · ${d.kind === 'added' ? 'new' : 'changed'}</th>
          <td>${esc(v)}${was}${extra}</td>
        </tr>`;
      }
      return `<tr class="${extra ? 'offline-row' : ''}"><th>${esc(k)}</th><td>${esc(v)}${extra}</td></tr>`;
    }).join('');

    const nDelta = Object.keys(deltas).length;
    let note = '';
    if (state.view === 'features') {
      note = kindOf(p) === 'new'
        ? `<p class="no-delta-note">Create — these tags will be new on import (not in BCC yet).</p>`
        : (deltas.features
          ? `<p class="no-delta-note"><strong>Green +</strong> = new vs live · <strong>plain</strong> = already on live · <strong>red −</strong> = on live but we are not keeping (e.g. Buried).</p>`
          : `<p class="no-delta-note">Feature set matches live BCC.</p>`);
    } else if (state.view === 'images') {
      const n = imageList(p).length;
      const mo = p.fields && p.fields.cdpMouseOverImage;
      note = `<p class="no-delta-note"><strong>${n}</strong> image URL(s) · primary + alts in gallery · mouseover: <code>${esc(mo || '—')}</code>. Click thumbs to compare (category vs change-state).</p>`;
    } else if (kindOf(p) === 'live') {
      note = `<p class="no-delta-note">In BCC with <strong>no field deltas</strong> vs live — nothing green to highlight.</p>`;
    } else if (kindOf(p) === 'update') {
      note = `<p class="no-delta-note"><strong>${nDelta}</strong> field(s) differ from live BCC (green rows), including features when tagged differently.</p>`;
    }

    const label = state.view === 'features'
      ? 'Feature context'
      : state.view === 'images'
        ? 'Image fields'
        : 'Import fields';
    return `
      <div class="section-label">${label}</div>
      ${note}
      <table class="fields">${rows}</table>`;
  }

  function stripHtml(html) {
    if (!html) return '';
    const d = document.createElement('div');
    d.innerHTML = html;
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function renderHtmlPane(html) {
    if (!html || !String(html).trim()) {
      return `<div class="pane empty">(empty)</div>`;
    }
    return `<div class="pane">${html}</div>`;
  }

  function wordDiffHtml(beforeText, afterText) {
    const a = beforeText ? beforeText.split(/(\s+)/) : [];
    const b = afterText ? afterText.split(/(\s+)/) : [];
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        if (a[i] === b[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
        else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    let i = 0, j = 0, html = '';
    while (i < n && j < m) {
      if (a[i] === b[j]) { html += esc(a[i]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) {
        html += a[i].trim() ? `<del>${esc(a[i])}</del>` : esc(a[i]);
        i++;
      } else {
        html += b[j].trim() ? `<ins>${esc(b[j])}</ins>` : esc(b[j]);
        j++;
      }
    }
    while (i < n) { html += a[i].trim() ? `<del>${esc(a[i])}</del>` : esc(a[i]); i++; }
    while (j < m) { html += b[j].trim() ? `<ins>${esc(b[j])}</ins>` : esc(b[j]); j++; }
    return html || '<span class="empty">(empty)</span>';
  }

  function isNewCopyField(p, field, entry) {
    const after = (entry && entry.after) || '';
    const changed = !!(entry && entry.changed);
    const added = !!(entry && entry.added);
    // Live: only wording changes or newly filled fields
    if (changed || added) return true;
    // Create: merch copy that has content counts as "new"
    if (kindOf(p) === 'new' && COPY_NEWS_KEYS.includes(field.key) && String(after).trim()) {
      return true;
    }
    return false;
  }

  function copyBlockHtml(p, field) {
    const entry = (p.copy && p.copy[field.key]) || {};
    const after = entry.after || '';
    const before = entry.before || '';
    const changed = !!entry.changed;
    const added = !!entry.added;
    const isCreateCopy = kindOf(p) === 'new' && !!String(after).trim() && COPY_NEWS_KEYS.includes(field.key);

    // Copy view: hide unchanged fields entirely
    if (state.view === 'copy' && !isNewCopyField(p, field, entry)) {
      return '';
    }

    // No before/after chrome unless real wording change
    if (!changed && !added) {
      if (!String(after).trim()) {
        return `
          <div class="copy-block">
            <header><span>${esc(field.label)}</span></header>
            ${renderHtmlPane('')}
          </div>`;
      }
      return `
        <div class="copy-block${isCreateCopy && state.view === 'copy' ? ' news' : ''}">
          <header>
            <span>${esc(field.label)}${isCreateCopy && state.view === 'copy' ? ' <span class="badge copy-new">new</span>' : ''}</span>
          </header>
          ${renderHtmlPane(after)}
        </div>`;
    }

    if (added && !changed) {
      return `
        <div class="copy-block news">
          <header>
            <span>${esc(field.label)} <span class="badge copy-new">added</span></span>
          </header>
          ${renderHtmlPane(after)}
        </div>`;
    }

    // Wording changed — full before/after + diff
    const diff = wordDiffHtml(stripHtml(before), stripHtml(after));
    return `
      <div class="copy-block news">
        <header>
          <span>${esc(field.label)} <span class="badge copy-new">changed</span></span>
        </header>
        <div class="side-by-side">
          <div class="col before-col">
            <div class="col-label">Before (live)</div>
            ${renderHtmlPane(before)}
          </div>
          <div class="col after-col">
            <div class="col-label">After (import)</div>
            ${renderHtmlPane(after)}
          </div>
        </div>
        <div class="col-label" style="padding-top:.45rem">Diff</div>
        <div class="diff-pane">${diff}</div>
      </div>`;
  }

  function cardHtml(p) {
    const k = kindOf(p);
    const online = isTruthy(p.fields.showOnline);
    const deltas = deltaList(p);
    const copyNews = hasCopyNews(p);

    const featNews = hasFeatureNews(p);
    const kindLabel = k === 'new' ? 'new' : k === 'update' ? 'update' : 'live';
    const badges = [
      `<span class="badge ${kindLabel}">${kindLabel === 'update' ? 'has changes' : kindLabel === 'live' ? 'no changes' : 'new'}</span>`,
      online ? '' : `<span class="badge offline">offline</span>`,
      copyNews && (k !== 'new' || state.view === 'copy') ? `<span class="badge copy-new">copy</span>` : '',
      featNews && (k !== 'new' || state.view === 'features') && p.deltas && p.deltas.features
        ? `<span class="badge copy-new">features</span>`
        : '',
    ].filter(Boolean).join(' ');

    const chips = deltas.length
      ? `<div class="delta-chips">${deltas.map((f) => {
          const kind = (p.deltas[f] && p.deltas[f].kind) || 'changed';
          return `<span class="delta-chip${kind === 'added' ? ' added' : ''}">${esc(f)}${kind === 'added' ? ' +' : ''}</span>`;
        }).join('')}</div>`
      : '';

    const focus = state.view;
    const showFields = focus !== 'copy';
    const showCopy = focus !== 'features' && focus !== 'images';
    const copyBlocks = showCopy ? COPY_FIELDS.map((f) => copyBlockHtml(p, f)).join('') : '';
    const hasCopyBlocks = !!copyBlocks.trim();

    // Focused views: less chrome (notes/blockers)
    const slim = focus === 'copy' || focus === 'features' || focus === 'images';
    const notes = (!slim && p.notes)
      ? `<div class="notes"><strong>Notes:</strong> ${esc(p.notes)}</div>`
      : '';
    const blockers = (!slim && p.blockers && p.blockers.length)
      ? `<div class="blockers">Blockers: ${esc(p.blockers.join('; '))}</div>`
      : '';
    const showChips = focus === 'all' && chips;

    const cardClass = focus === 'copy'
      ? ' copy-focus'
      : focus === 'features'
        ? ' features-focus'
        : focus === 'images'
          ? ' images-focus'
          : '';

    return `
      <article class="card${cardClass}" id="sku-${esc(p.sku)}" data-sku="${esc(p.sku)}">
        <div class="card-head">
          <h2>${esc(p.displayName || p.sku)}</h2>
          <span class="sku">${esc(p.sku)}</span>
          ${badges}
          ${p.series ? `<span class="sku">${esc(p.series)}</span>` : ''}
          ${showChips || ''}
        </div>
        <div class="card-body">
          ${galleryHtml(p)}
          <div class="detail">
            ${showFields ? fieldsHtml(p) : ''}
            ${hasCopyBlocks ? `<div class="section-label">${focus === 'copy' ? 'New / updated copy' : 'Copy'}</div><div class="copy-area">${copyBlocks}</div>` : ''}
            ${notes}
            ${blockers}
          </div>
        </div>
      </article>`;
  }

  function updateHint() {
    const m = state.data.meta;
    const parts = [];
    if (state.kind === 'update') {
      parts.push(`${m.update} live products have field changes (green), including features when tags differ from live.`);
    } else if (state.kind === 'live') {
      parts.push(`${m.live} live products match BCC on compared fields (incl. features).`);
    } else if (state.kind === 'new') {
      parts.push(`${m.new} creates (not in BCC export).`);
    }
    if (state.view === 'copy') {
      parts.push(`Copy view: products with new/changed merch copy only; field table and unchanged copy hidden. Wording Δ: ${m.copyWordingChanged}.`);
    } else if (state.view === 'features') {
      parts.push(`Features view: products with feature tags to review (live Δ or create). Feature deltas: ${m.featureDeltas || 0}. Image + feature context only.`);
    } else if (state.view === 'images') {
      const nMulti = (state.data.products || []).filter(hasMultipleImages).length;
      parts.push(`Images view: only SKUs with 2+ images (primary + alts). ${nMulti} multi-image products. Gallery + image fields only — use thumbs to check category vs change-state.`);
    }
    $('filterHint').textContent = parts.join(' ');
  }

  function render() {
    if (!state.data) return;
    const items = filtered();
    const { pageItems, pages, start, size } = pageSlice(items);
    const range = rangeText(items.length, start, pageItems.length, size);

    // Sticky chrome always shows the live range for current filters / page size
    const pageBit = pages > 1 ? ` · page ${state.page + 1} of ${pages}` : '';
    $('countLine').textContent = range + pageBit;
    updateHint();

    // Pager mirrors the same range (hidden when everything fits one page)
    if (size && pages > 1) {
      pagerEl.hidden = false;
      $('pageInfo').textContent = range;
      $('prevBtn').disabled = state.page <= 0;
      $('nextBtn').disabled = state.page >= pages - 1;
    } else {
      pagerEl.hidden = true;
      $('pageInfo').textContent = range; // keep in sync even while hidden
    }

    if (!pageItems.length) {
      listEl.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    listEl.innerHTML = pageItems.map(cardHtml).join('');
  }

  function wireCardEvents() {
    listEl.addEventListener('click', (e) => {
      const thumb = e.target.closest('.thumb');
      if (!thumb) return;
      const gal = thumb.closest('.gallery');
      const hero = gal.querySelector('.hero-img');
      const src = thumb.getAttribute('data-src');
      if (hero) hero.src = src;
      gal.querySelectorAll('.thumb').forEach((t) => t.classList.toggle('active', t === thumb));
    });
  }

  function setMeta() {
    const m = state.data.meta;
    $('metaLine').textContent =
      `${m.total} products · ${m.new} new · ${m.update} live w/ changes · ${m.live} live unchanged · ` +
      `${m.showOnline} showOnline · feature Δ ${m.featureDeltas || 0} · copy wording Δ ${m.copyWordingChanged} · ${m.generated}`;
  }

  function bindFilters() {
    // Keep range in URL-ish sync not required; always re-read page size from the control
    const syncPageSize = () => {
      state.pageSize = parseInt($('pageSize').value, 10) || 0;
    };
    syncPageSize();

    $('q').addEventListener('input', (e) => { state.q = e.target.value; state.page = 0; render(); });
    $('kind').addEventListener('change', (e) => { state.kind = e.target.value; state.page = 0; render(); });
    $('online').addEventListener('change', (e) => { state.online = e.target.value; state.page = 0; render(); });
    $('view').addEventListener('change', (e) => { state.view = e.target.value; state.page = 0; render(); });
    $('pageSize').addEventListener('change', () => {
      syncPageSize();
      state.page = 0;
      render();
    });
    $('prevBtn').addEventListener('click', () => {
      state.page -= 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    $('nextBtn').addEventListener('click', () => {
      state.page += 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  async function loadData() {
    // Prefer network data.json (no-store) so GitHub Pages / browser cache
    // does not keep stale category & feature tags for hours.
    // Fall back to embedded data.js for file:// or offline.
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch (_) { /* file:// or offline */ }
    if (window.CASEGOOD_REVIEW_DATA) return window.CASEGOOD_REVIEW_DATA;
    throw new Error('Failed to load data.json and no embedded CASEGOOD_REVIEW_DATA');
  }

  async function init() {
    bindFilters();
    wireCardEvents();
    try {
      state.data = await loadData();
      setMeta();
      const params = new URLSearchParams(location.search);
      if (params.get('sku')) { state.q = params.get('sku'); $('q').value = state.q; }
      if (params.get('kind')) { state.kind = params.get('kind'); $('kind').value = state.kind; }
      // legacy ?mode=
      if (params.get('mode') === 'update') { state.kind = 'update'; $('kind').value = 'update'; }
      if (params.get('mode') === 'create' || params.get('mode') === 'new') { state.kind = 'new'; $('kind').value = 'new'; }
      if (params.get('online') === '1' || params.get('online') === 'true') {
        state.online = 'true'; $('online').value = 'true';
      }
      if (params.get('online') === '0' || params.get('online') === 'false') {
        state.online = 'false'; $('online').value = 'false';
      }
      // view=copy|features|images|all  (legacy: newCopy=1 / copyOnly=1 → copy)
      const viewParam = params.get('view');
      if (viewParam === 'copy' || viewParam === 'features' || viewParam === 'images' || viewParam === 'all') {
        state.view = viewParam;
        $('view').value = state.view;
      } else if (params.get('newCopy') === '1' || params.get('copyOnly') === '1') {
        state.view = 'copy';
        $('view').value = 'copy';
      }
      render();
      if (params.get('sku')) {
        requestAnimationFrame(() => {
          const el = document.getElementById('sku-' + params.get('sku'));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }
    } catch (e) {
      errEl.hidden = false;
      errEl.textContent = 'Could not load product data. ' + e.message;
    }
  }

  init();
})();
  </script>
</body>
</html>
